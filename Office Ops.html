<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Office Ops</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f4;--sf:#fff;--tx:#1e2321;--mu:#68716d;--bd:#dfe3e0;--ac:#17604f;--ac2:#e3f1ec;--dn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151816;--sf:#1e2220;--tx:#e8ece9;--mu:#9aa5a0;--bd:#323836;--ac:#5cc4a8;--ac2:#1f332d;--dn:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151816;--sf:#1e2220;--tx:#e8ece9;--mu:#9aa5a0;--bd:#323836;--ac:#5cc4a8;--ac2:#1f332d;--dn:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:200px;background:var(--sf);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
nav b{padding:4px 10px 12px;font-size:15px}nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--mu)}
nav button:hover{background:var(--bg)}nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{flex:1;padding:20px;min-width:0;max-width:1100px}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 8px;font-size:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px;min-width:0}.k{font-size:22px;font-weight:600}.m{color:var(--mu);font-size:12px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;width:100%;margin:0 0 6px}
.r{display:flex;gap:6px;flex-wrap:wrap}.r>*{flex:1;min-width:90px}
.b{font:inherit;cursor:pointer;background:var(--ac);color:var(--sf);border:0;border-radius:6px;padding:7px 12px}.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.b.d{background:var(--dn)}.b:disabled{opacity:.5;cursor:default}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}td.n,th.n{text-align:right}
.p{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--ac2);color:var(--ac)}.p.w{background:#fdecc8;color:#7a4b00}.p.x{background:#fbe0dd;color:var(--dn)}
#rcpt{display:none}#msg{position:fixed;bottom:16px;right:16px;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:6px;display:none;z-index:9}
#pvt{display:none}body.pv #pvt{display:flex;position:fixed;top:8px;left:50%;transform:translateX(-50%);gap:6px;z-index:9;background:var(--sf);border:1px solid var(--bd);padding:6px;border-radius:8px;align-items:center}
body.pv::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:7}
body.pv #rcpt{display:block;position:fixed;top:60px;bottom:12px;left:50%;transform:translateX(-50%);max-width:96vw;overflow:auto;background:#fff;color:#000;padding:12px;z-index:8;border-radius:6px;font:12px/1.3 monospace}
body.pv #rcpt th,body.pv #rcpt td{color:#000}body.pv #rcpt table:not(.bt) td,body.pv #rcpt table:not(.bt) th{padding:1px 2px;border:0;white-space:normal}
@media print{body.pv #rcpt{position:static;transform:none;max-width:none;padding:0;border-radius:0}body.pv::after{display:none}}
@media (max-width:700px){body{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}nav b{display:none}nav button{white-space:nowrap}}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;color:#000;background:#fff;font:12px/1.3 monospace}#rcpt table{width:100%}#rcpt th,#rcpt td{padding:1px 2px;border:0;color:#000;white-space:normal}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="rcpt"></div><div id="msg" role="status"></div><div id="dlg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center"><div class="c" style="max-width:440px;width:92%;margin:0"><div id="dmsg" style="white-space:pre-line;margin-bottom:10px"></div><input id="din"><div class="r"><button class="b" id="dok">OK</button><button class="b s" id="dcn">Cancel</button></div></div></div><div id="pvt"><select id="pvsel" style="width:auto;margin:0" onchange="pvs(this.value)"><option value="80">80 mm receipt<option value="58">58 mm receipt<option value="A4">A4<option value="B2B">A4 GST tax invoice</select><button class="b" onclick="pvd()">Download PDF</button><button class="b s" onclick="pvp()">Print</button><button class="b s" onclick="pvc()">Close</button></div><style id="pg"></style><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const K="oms1";let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{set:{name:"My Business",gstin:"",state:"Uttar Pradesh",incl:true,start:"09:30",grace:10},prods:[],emps:[],att:[],invs:[],mov:[],seq:0};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),V=id=>($("#"+id)||{}).value||"",uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=s=>Math.round(parseFloat(s||0)*100)||0,R=p=>"₹"+(p/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const IST=d=>new Date(d).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"});
const dayKey=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
const mins=d=>{let[h,m]=new Date(d).toLocaleTimeString("en-GB",{timeZone:"Asia/Kolkata",hour12:false}).split(":");return +h*60+ +m};
function toast(t){let m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",2800)}
let cur="dash",cart=[],draft=uid();
const TABS={dash:"Dashboard",att:"Attendance",inv:"Inventory",bill:"Billing",invs:"Invoices",cust:"Customers",set:"Settings"};
function go(t){cur=t;eid=null;$("#nav").innerHTML="<b>"+esc(S.set.name)+"</b>"+Object.keys(TABS).map(k=>`<button class="${k==t?"on":""}" onclick="go('${k}')">${TABS[k]}</button>`).join("");$("#main").innerHTML=VW[t]();if(t=="bill"){recalc();srch()}}
const net=i=>i.T.grand-(i.credit||0),paid=i=>i.pays.reduce((a,p)=>a+p.amt,0),st=i=>i.cancelled?"Cancelled":paid(i)>=net(i)?"Paid":paid(i)>0?"Partly paid":"Unpaid";
const pill=s=>`<span class="p ${s=="Paid"?"":s=="Cancelled"?"x":"w"}">${s}</span>`;
function mv(p,q,type,why){p.stock=Math.round((p.stock+q)*1000)/1000;S.mov.unshift({at:new Date().toISOString(),pid:p.id,name:p.name,q,type,why})}
const INC=()=>{const v=V("tx");return v===""?S.set.incl:v=="1"};
function calc(c,intra){const bp=Math.min(100,Math.max(0,parseFloat(V("bd"))||0)),L=c.map(x=>{const p=S.prods.find(y=>y.id==x.id),g=Math.round(p.price*x.q),d0=Math.min(g,P(x.d)),n=g-d0-Math.round((g-d0)*bp/100),d=g-n,r=p.gst;let t,tx;if(INC()){t=Math.round(n*100/(100+r));tx=n-t}else{t=n;tx=Math.round(n*r/100)}return{id:p.id,name:p.name,sku:p.sku,hsn:p.hsn,q:x.q,rate:p.price,disc:d,gst:r,taxable:t,tax:tx,total:t+tx}});
const fr=P(V("fr"));if(fr>0){const r=+V("fg")||0;let t,tx;if(INC()){t=Math.round(fr*100/(100+r));tx=fr-t}else{t=fr;tx=Math.round(fr*r/100)}L.push({id:"",name:"Freight charge",sku:"",hsn:"9968",q:1,rate:fr,disc:0,gst:r,taxable:t,tax:tx,total:t+tx})}
const T={taxable:0,total:0,cgst:0,sgst:0,igst:0};L.forEach(l=>{T.taxable+=l.taxable;T.total+=l.total;if(intra){const h=Math.floor(l.tax/2);T.cgst+=h;T.sgst+=l.tax-h}else T.igst+=l.tax});
T.grand=Math.round(T.total/100)*100;T.round=T.grand-T.total;return{L,T}}
const intra=()=>{const g=V("cg").trim(),b=S.set.gstin;if(g.length>=2&&b.length>=2)return g.slice(0,2)==b.slice(0,2);const s=V("cs").trim().toLowerCase();return!s||s==S.set.state.toLowerCase()};
const VW={
dash(){const td=dayKey(new Date()),ok=S.invs.filter(i=>!i.cancelled),ti=ok.filter(i=>dayKey(i.at)==td),
recv=ok.reduce((a,i)=>a+i.pays.filter(p=>dayKey(p.at)==td).reduce((x,p)=>x+p.amt,0),0),out=ok.reduce((a,i)=>a+net(i)-paid(i),0),
pres=S.att.filter(a=>a.day==td&&!a.absent).length,low=S.prods.filter(p=>p.stock<=p.min),val=S.prods.reduce((a,p)=>a+p.stock*p.cost,0),
gs=k=>ok.reduce((a,i)=>a+i.T[k],0),card=(l,v)=>`<div class="c"><div class="m">${l}</div><div class="k">${v}</div></div>`;
return`<h2>Dashboard</h2><div class="g">${card("Sales today",R(ti.reduce((a,i)=>a+net(i),0)))}${card("Invoices today",ti.length)}${card("Received today",R(recv))}${card("Outstanding",R(out))}${card("Present today",pres+" / "+S.emps.length)}${card("Absent today",S.att.filter(a=>a.day==td&&a.absent).length)}${card("Low stock",low.length)}${card("Stock value (cost)",R(val))}</div>
<div class="c"><h3>GST collected (all active invoices)</h3>CGST ${R(gs("cgst"))} · SGST ${R(gs("sgst"))} · IGST ${R(gs("igst"))}</div>
${S.prods.length?"":`<div class="c">No data yet. Add products in Inventory, or <button class="b s" onclick="demo()">load demo data</button> to try the app.</div>`}
<div class="c"><h3>Collections today by method</h3>${(()=>{const m={};ok.forEach(i=>i.pays.forEach(p=>{if(dayKey(p.at)==td)m[p.method]=(m[p.method]||0)+p.amt}));return Object.keys(m).map(k=>k+" "+R(m[k])).join(" · ")||"No payments yet"})()}</div><div class="c"><h3>Low-stock products</h3>${low.map(p=>esc(p.name)+" ("+p.stock+")").join(", ")||"None"}</div>`},
att(){const td=dayKey(new Date());return`<h2>Attendance</h2><div class="c"><h3>Add employee</h3><div class="r"><input id="en" placeholder="Full name"><input id="ed" placeholder="Department"><button class="b" onclick="addEmp()">Add</button></div></div>
<div class="c t"><table><tr><th>ID</th><th>Name</th><th>Today</th><th>In</th><th>Out</th><th>Hours</th><th></th></tr>${S.emps.map(e=>{const a=S.att.find(x=>x.eid==e.id&&x.day==td);return`<tr><td>${e.code}</td><td>${esc(e.name)}<div class="m">${esc(e.dept)}</div></td><td>${a&&a.absent?'<span class="p x">Absent</span>':a?(a.late?'<span class="p w">Late</span>':'<span class="p">Present</span>'):'<span class="p x">Not in</span>'}</td><td>${a&&a.in?IST(a.in).split(", ").pop():"-"}</td><td>${a&&a.out?IST(a.out).split(", ").pop():"-"}</td><td>${a&&a.out?((new Date(a.out)-new Date(a.in))/36e5).toFixed(2):"-"}</td><td><button class="b s" onclick="ck('${e.id}')">${a&&a.in&&!a.out?"Check out":"Check in"}</button> ${a&&a.absent?`<button class="b s" onclick="ab('${e.id}',0)">Undo absent</button>`:a?"":`<button class="b s" onclick="ab('${e.id}',1)">Mark absent</button>`}</td></tr>`}).join("")||'<tr><td colspan=7 class="m">Add an employee to start marking attendance.</td></tr>'}</table></div>
<button class="b s" onclick="absAsk()">Mark all not-in as absent</button> <p class="m">Shift starts ${S.set.start} IST with a ${S.set.grace}-minute grace period (change in Settings). A missing check-out stays open until corrected.</p>`},
inv(){return`<h2>Inventory</h2><div class="c"><h3 id="ph3">Add product</h3><div class="r"><input id="pn" placeholder="Name"><input id="ps" placeholder="SKU / barcode"><input id="ph" placeholder="HSN"></div><div class="r"><input id="pp" type="number" placeholder="Selling price ₹"><input id="pc" type="number" placeholder="Cost ₹"><select id="pg"><option>0</option><option>5</option><option selected>12</option><option>18</option><option>28</option></select><input id="po" type="number" placeholder="Opening stock"><input id="pm" type="number" placeholder="Min stock"></div><button class="b" id="pbtn" onclick="addProd()">Add product</button> <button class="b s" id="pcan" style="display:none" onclick="go('inv')">Cancel edit</button></div>
<div class="c t"><table><tr><th>Product</th><th>SKU</th><th class="n">Price</th><th class="n">GST</th><th class="n">Stock</th><th>Adjust (reason required)</th></tr>${S.prods.map(p=>`<tr><td>${esc(p.name)} <button class="b s" onclick="editProd('${p.id}')">Edit</button> <button class="b s" onclick="delProd('${p.id}')">Delete</button></td><td>${esc(p.sku)}</td><td class="n">${R(p.price)}</td><td class="n">${p.gst}%</td><td class="n">${p.stock<=p.min?'<span class="p x">'+p.stock+"</span>":p.stock}</td><td><input id="a${p.id}" type="number" step="any" placeholder="±qty" style="width:70px;display:inline"> <input id="w${p.id}" placeholder="Reason" style="width:120px;display:inline"> <button class="b s" onclick="adj('${p.id}')">Apply</button></td></tr>`).join("")||'<tr><td colspan=6 class="m">No products yet.</td></tr>'}</table></div>
<div class="c t"><h3>Recent stock movements</h3><table><tr><th>When</th><th>Product</th><th class="n">Qty</th><th>Type</th><th>Reason</th></tr>${S.mov.slice(0,15).map(m=>`<tr><td>${IST(m.at)}</td><td>${esc(m.name)}</td><td class="n">${m.q}</td><td>${m.type}</td><td>${esc(m.why)}</td></tr>`).join("")}</table></div>`},
bill(){return`<h2>Billing</h2><div class="g2"><div><div class="c"><h3>Items</h3><input id="q" placeholder="Search name, SKU or scan barcode, then Enter" oninput="srch()" onfocus="srch()" onkeydown="if(event.key=='Enter')srch(1)"><div id="res"></div></div>
<div class="c"><h3>Customer (optional)</h3><input id="cn" list="cl" placeholder="Name (pick a saved customer)" onchange="cfill()"><datalist id="cl">${(S.custs||[]).map(c=>`<option>${esc(c.name)}`).join("")}</datalist><div class="r"><input id="cp" placeholder="WhatsApp number with country code"><input id="ce" placeholder="Email"></div><input id="cs" list="sts" placeholder="State (blank = ${esc(S.set.state)}); other state bills IGST" oninput="recalc()"><datalist id="sts"><option>Delhi<option>Maharashtra<option>Karnataka<option>Gujarat<option>Tamil Nadu<option>Uttar Pradesh</datalist><input id="cg" placeholder="Customer GSTIN (B2B; sets CGST/SGST or IGST)" oninput="recalc()"><input id="ca" placeholder="Billing address"><input id="cx" placeholder="Ship-to address (blank = same)"><div class="r"><input id="ct" placeholder="Contact person"><input id="pono" placeholder="PO no."><input id="podt" placeholder="PO date"></div></div></div>
<div class="c"><h3>Cart</h3><div id="cart" class="t"></div><div id="tot"></div><select id="tx" onchange="recalc()"><option value="1" ${S.set.incl?"selected":""}>Prices include GST</option><option value="0" ${S.set.incl?"":"selected"}>Prices exclude GST (GST added on top)</option></select><div class="r"><input id="bd" type="number" min="0" max="100" placeholder="Bill discount %" oninput="recalc()"><input id="fr" type="number" min="0" placeholder="Freight/other charge ₹ (HSN 9968)" oninput="recalc()"><select id="fg" title="GST % on freight" onchange="recalc()"><option>0<option>5<option>12<option selected>18</select></div><div class="r"><input id="am" type="number" placeholder="Amount received ₹ (blank = full)"><select id="pm2"><option>Cash<option>UPI<option>Card<option>Bank transfer</select></div><button class="b" id="fin" onclick="fin()">Finalize invoice</button></div></div>`},
invs(){return`<h2>Invoices</h2><input placeholder="Search by invoice number, customer or status" oninput="for(const r of document.querySelectorAll('#itb tr.ir'))r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase())"><div class="c t"><table id="itb"><tr><th>No.</th><th>Date</th><th>Customer</th><th class="n">Total</th><th class="n">Due</th><th>Status</th><th>Actions</th></tr>${S.invs.map(i=>`<tr class="ir"><td>${i.no}</td><td>${IST(i.at)}</td><td>${esc(i.cust.name||"Walk-in")}</td><td class="n">${R(i.T.grand)}</td><td class="n">${i.cancelled?"-":R(net(i)-paid(i))}</td><td>${pill(st(i))}</td><td><button class="b s" onclick="pv('${i.id}','${i.cust.gstin?"B2B":"80"}')">Preview</button> <select onchange="pr('${i.id}',this.value);this.selectedIndex=0" style="width:auto;margin:0"><option>Print…<option value="58">58 mm<option value="80">80 mm<option value="A4">A4<option value="B2B">A4 GST tax invoice</select> <button class="b s" onclick="wa('${i.id}')">WhatsApp</button> <button class="b s" onclick="ml('${i.id}')">Email</button> ${!i.cancelled&&paid(i)<i.T.grand?`<button class="b s" onclick="rec('${i.id}')">Add payment</button>`:""} ${i.cancelled?"":`<button class="b s" onclick="ret('${i.id}')">Return</button> <button class="b d" onclick="canc('${i.id}')">Cancel</button>`}<button class="b s" onclick="delInv('${i.id}')">Delete</button><div class="m">${esc(i.log.join("; "))}</div></td></tr>`).join("")||'<tr><td colspan=7 class="m">No invoices yet. Create one in Billing.</td></tr>'}</table></div>${(S.del||[]).length?`<div class="c t"><h3>Deleted invoices (kept for your records)</h3><table><tr><th>No.</th><th>Customer</th><th class="n">Total</th><th>Was</th><th>Reason</th><th>Deleted</th></tr>${S.del.map(d=>`<tr><td>${esc(d.no)}</td><td>${esc(d.cust)}</td><td class="n">${R(d.total)}</td><td>${esc(d.was)}</td><td>${esc(d.reason)}</td><td>${IST(d.by)}</td></tr>`).join("")}</table></div>`:""}`},
cust(){return`<h2>Customers</h2><div class="c t"><table><tr><th>Name</th><th>Phone</th><th>State</th><th class="n">Purchases</th><th class="n">Outstanding</th></tr>${(S.custs||[]).map(c=>{const v=S.invs.filter(i=>!i.cancelled&&(c.phone?i.cust.phone==c.phone:i.cust.name==c.name));return`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.state)}</td><td class="n">${R(v.reduce((a,i)=>a+net(i),0))}</td><td class="n">${R(v.reduce((a,i)=>a+net(i)-paid(i),0))}</td></tr>`}).join("")||'<tr><td colspan=5 class="m">Customers are saved automatically when you bill them by name or phone.</td></tr>'}</table></div>`},
set(){const s=S.set;return`<h2>Settings</h2><div class="c" style="max-width:480px"><input id="sn" value="${esc(s.name)}" placeholder="Business name"><input id="sad" value="${esc(s.addr||"")}" placeholder="Business address"><div class="r"><input id="sph" value="${esc(s.phone||"")}" placeholder="Phone"><input id="sem" value="${esc(s.email||"")}" placeholder="Email"></div><input id="spx" value="${esc(s.pfx||"")}" placeholder="Invoice prefix, e.g. TIHJ gives TIHJ2627/10/001 (blank = INV-2627-0001)"><input id="sbk" value="${esc(s.bank||"")}" placeholder="Bank account, IFSC and branch"><textarea id="stm" rows="3" placeholder="Terms and conditions, one per line">${esc(s.terms||"")}</textarea><input id="sg" value="${esc(s.gstin)}" placeholder="GSTIN (blank = bill of supply, no tax)"><input id="ss" value="${esc(s.state)}" placeholder="Business state"><select id="si"><option value="1" ${s.incl?"selected":""}>Prices include GST</option><option value="0" ${s.incl?"":"selected"}>Prices exclude GST</option></select><div class="r"><input id="st1" type="time" value="${s.start}"><input id="sgr" type="number" value="${s.grace}"></div><button class="b" onclick="saveSet()">Save settings</button> <textarea id="bk" rows="3" placeholder="Backup text appears here. Copy it somewhere safe. To restore, paste a backup here."></textarea><button class="b s" onclick="$('#bk').value=JSON.stringify(S)">Show backup</button> <button class="b s" onclick="restore()">Restore from box</button> <button class="b s" onclick="resetAll()">Erase all data</button></div>`}};
function saveSet(){Object.assign(S.set,{addr:V("sad"),phone:V("sph"),email:V("sem"),pfx:V("spx").trim(),bank:V("sbk"),terms:V("stm"),name:V("sn"),gstin:V("sg").toUpperCase(),state:V("ss"),incl:V("si")=="1",start:V("st1"),grace:+V("sgr")||0});save();toast("Settings saved");go("set")}
function addEmp(){if(!V("en").trim())return toast("Enter the employee name");S.emps.push({id:uid(),code:"E"+String(S.emps.length+1).padStart(3,"0"),name:V("en").trim(),dept:V("ed")});save();go("att")}
